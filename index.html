<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Street Fight - Pixel Brawl</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="title-card">
        <div class="brand-mark"><span></span><span></span><span></span></div>
        <p class="eyebrow">NEON DISTRICT // FIGHT NIGHT 01</p>
        <h1>STREET <em>FIGHT</em></h1>
        <p class="subtitle">A 3D pixel brawl after dark</p>
      </header>

      <section class="cabinet" aria-label="Street Fight game">
        <div class="hud">
          <div class="fighter-stat">
            <div class="fighter-name"><span class="avatar-dot player-dot"></span><span class="label">PLAYER // 01</span></div>
            <div class="health-track"><div id="player-health" class="health player-health"></div></div>
            <span class="hud-caption">BLUE COMET</span>
          </div>
          <div class="score-box"><span class="score-label">SCORE</span><strong id="score">000000</strong><span class="round">ROUND 01</span></div>
          <div class="fighter-stat enemy-stat">
            <div class="fighter-name"><span class="label">RIVAL // 02</span><span class="avatar-dot rival-dot"></span></div>
            <div class="health-track"><div id="enemy-health" class="health enemy-health"></div></div>
            <span class="hud-caption">PINK PHANTOM</span>
          </div>
        </div>

        <div class="canvas-wrap">
          <canvas id="game" width="960" height="540" aria-label="Playable Street Fight canvas"></canvas>
          <div id="message" class="message">
            <strong>READY?</strong>
            <span>Press ENTER to start the fight</span>
          </div>
        </div>

        <div class="controls">
          <span class="control-kicker">LOADOUT</span>
          <span><kbd>A</kbd><kbd>D</kbd> MOVE</span>
          <span><kbd>W</kbd> JUMP</span>
          <span><kbd>J</kbd> PUNCH</span>
          <span><kbd>K</kbd> KICK</span>
          <span><kbd>ENTER</kbd> START / RESTART</span>
        </div>
      </section>
      <p class="footer">BEST PLAYED LOUD // 8-BIT HEART, 16-BIT ATTITUDE</p>
    </main>
    <script src="game.js"></script>
  </body>
</html>
